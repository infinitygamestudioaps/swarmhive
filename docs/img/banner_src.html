<!doctype html>
<html><head><meta charset="utf-8"><title>SwarmHive banner</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* SwarmHive banner (2026-10-10): plain and typographic, the product itself on the right (a real dashboard screenshot from the
     user guide, sandbox data). 1280x640 = GitHub social preview + README top. Render: see the comment at the end. */
  html, body { margin: 0; padding: 0; }
  body { width: 1280px; height: 640px; overflow: hidden; background: #12100d; color: #e9dfc6; position: relative; }
  .shot { position: absolute; left: 640px; top: 64px; width: 780px; height: 512px; overflow: hidden;
          border: 1px solid #4a3c25; box-shadow: 0 18px 40px rgba(0,0,0,.55); }
  .shot img { position: absolute; left: -40px; top: -345px; width: 1440px; }
  .fade { position: absolute; left: 640px; top: 64px; width: 140px; height: 512px; background: linear-gradient(90deg, #12100d, rgba(18,16,13,0)); }
  .copy { position: absolute; left: 84px; top: 0; height: 640px; width: 520px; display: flex; flex-direction: column; justify-content: center; }
  .kicker { font: 500 15px/1 'Cinzel', Georgia, serif; letter-spacing: .32em; color: #b89a5e; margin-bottom: 22px; }
  h1 { margin: 0; font: 700 76px/1 'Cinzel', Georgia, serif; letter-spacing: .01em; color: #e8c473; }
  .rule { width: 72px; height: 2px; background: #b8893a; margin: 30px 0 26px; }
  .tag { font: 500 34px/1.15 'EB Garamond', Georgia, serif; color: #f1e8d2; }
  .what { margin-top: 18px; font: 400 20px/1.5 'EB Garamond', Georgia, serif; color: #b5a888; max-width: 420px; }
  .foot { position: absolute; left: 84px; bottom: 34px; font: 400 14px/1 'EB Garamond', Georgia, serif; color: #7c7058; letter-spacing: .02em; }
</style></head>
<body>
  <div class="shot"><img src="../guide/img/readme_raid_live_desktop.png" alt=""></div>
  <div class="fade"></div>
  <div class="copy">
    <div class="kicker">LINEAGE II · L2SWARM</div>
    <h1>SwarmHive</h1>
    <div class="rule"></div>
    <div class="tag">Lead the swarm.</div>
    <div class="what">Whole parties that level, restock, raid and run Kamaloka on their own, with one leader deciding and a dashboard on your phone.</div>
  </div>
  <div class="foot">Open source · MIT · a fan project, not affiliated with NCSOFT or the L2Swarm developer</div>
<!-- render (from a folder where ../guide/img/ holds the guide screenshots, e.g. the package's docs/img):
     msedge --headless=new --hide-scrollbars --window-size=1280,640 --virtual-time-budget=6000 --screenshot=social_preview.png banner_src.html -->
</body></html>
